<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospect Mirror | Acquia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="logo-group">
          <svg class="acquia-logo" viewBox="0 0 120 60" height="30">
            <path d="M39.6 25.8c1.5 0 3 .6 4 1.5.4-1.1.9-2 1.7-3-1.5-1.2-3.5-1.9-5.7-1.9-5.1 0-9.3 4.1-9.3 9.3 0 5.1 4.1 9.2 9.2 9.2 2.2 0 4.1-.7 5.7-1.9-.7-.9-1.2-1.9-1.7-3-1.1.9-2.4 1.5-4 1.5-3.2 0-5.9-2.6-5.9-5.9.1-3.2 2.7-5.8 6-5.8m-19.1-6.7c-.6 0-1.1.4-1.3.8L10 40.2h3.6l1.3-2.9H26l1.3 2.9H31L21.9 20c-.2-.5-.8-.9-1.4-.9m-4 15 4.1-9 4.1 9zm47.7-2.4c0-5.1-4-9-8.9-9.2-.1 0-.2.1-.1.2.4.7 1.2 2.4 2.6 3.5 1.9 1.4 3 3.2 3 5.4 0 2.8-2.2 5.9-5.8 5.9s-5.8-3.1-5.8-5.9c0-2.2 1.2-4 3-5.4 1.4-1.2 2.4-2.9 2.6-3.6.1-.1 0-.2-.1-.2-5.1.1-9 4.2-9 9.2 0 4.1 3.5 8.9 9.1 8.9 2.5 0 4.7-.7 6.2-2l1.8 1.7h5.1l-4.7-4.5c.6-1.1 1-2.5 1-4m22.3-8.9H90v17.4h-3.5zm-6.8 8.8c0 3.6-1.8 5.9-4.8 5.9s-4.8-2.3-4.8-5.9v-8.8h-3.5v8.8c0 5.3 3.5 9.1 8.3 9.1s8.3-3.8 8.3-9.1v-8.8h-3.5zm27-6-.7-.7c-1.5-1.7-3.4-2.5-5.4-2.5-2.3 0-4.3.8-5.8 2.6-1.5 1.7-2.3 4-2.3 6.5 0 2.6.8 4.9 2.3 6.6s3.6 2.6 5.9 2.6c1.9 0 3.6-.8 5.3-2.3l.6-.6v2.4h3.5V22.8h-3.5v2.8zM105.3 36c-1.1 1.2-2.4 1.7-4.1 1.7-1.5 0-2.9-.6-3.8-1.8S96 33.3 96 31.5c0-1.7.5-3.1 1.5-4.3s2.4-1.8 3.8-1.8c1.7 0 3 .6 4 1.8s1.5 2.6 1.5 4.5c.1 1.7-.4 3.1-1.5 4.3" fill="#0078D4"/>
          </svg>
          <span class="app-title">Prospect Mirror</span>
          <span class="app-subtitle">Demo Personalization + Competitive Analysis</span>
        </div>
      </div>
    </header>

    <!-- Hero / Input Section -->
    <section id="input-section" class="input-section">
      <div class="input-container">
        <h1>Analyze any prospect's website in seconds</h1>
        <p class="subtitle">Paste a URL to get a branded demo, competitive teardown, and performance scorecard.</p>
        <form id="analyze-form" class="url-form">
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8.5 3.5a5 5 0 100 10 5 5 0 000-10zM2 8.5a6.5 6.5 0 1111.58 4.02l3.95 3.95a.75.75 0 11-1.06 1.06l-3.95-3.95A6.5 6.5 0 012 8.5z" fill="currentColor"/></svg>
            </span>
            <input type="url" id="url-input" placeholder="https://prospect-website.com" required autocomplete="url">
            <button type="submit" id="analyze-btn">
              <span class="btn-text">Analyze</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
          <div id="input-error" class="input-error" hidden></div>
        </form>
      </div>
    </section>

    <!-- Progress Section -->
    <section id="progress-section" class="progress-section" hidden>
      <div class="progress-container">
        <div class="progress-header">
          <h2>Analyzing <span id="progress-url"></span></h2>
          <span id="progress-timer" class="timer">0s</span>
        </div>
        <div id="progress-phases" class="progress-phases">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="results-section" hidden>
      <div class="results-container">

        <!-- Results Header -->
        <div class="results-header">
          <div class="results-title-group">
            <h2 id="result-site-title"></h2>
            <a id="result-site-url" href="#" target="_blank" class="result-url"></a>
          </div>
          <div class="results-actions">
            <button id="export-pdf-btn" class="btn btn-secondary">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 14h12M8 2v9m0 0l3-3m-3 3L5 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Export PDF
            </button>
            <button id="new-analysis-btn" class="btn btn-ghost">New Analysis</button>
          </div>
        </div>

        <!-- Tab Navigation -->
        <nav class="tabs">
          <button class="tab active" data-tab="overview">Overview</button>
          <button class="tab" data-tab="brand">Brand</button>
          <button class="tab" data-tab="tech">Tech Stack</button>
          <button class="tab" data-tab="audit">Scorecard</button>
          <button class="tab" data-tab="competitive">Competitive</button>
          <button class="tab" data-tab="content">Content</button>
          <button class="tab" data-tab="drupal">Demo Site</button>
        </nav>

        <!-- Tab Panels -->
        <div class="tab-panels">

          <!-- Overview -->
          <div id="panel-overview" class="tab-panel active">
            <div class="overview-grid">
              <div class="overview-card" id="card-brand-summary">
                <h3>Brand</h3>
                <div id="brand-preview"></div>
              </div>
              <div class="overview-card" id="card-tech-summary">
                <h3>Tech Stack</h3>
                <div id="tech-preview"></div>
              </div>
              <div class="overview-card" id="card-scores-summary">
                <h3>Scores</h3>
                <div id="scores-preview"></div>
              </div>
              <div class="overview-card wide" id="card-competitive-summary">
                <h3>Competitive Summary</h3>
                <div id="competitive-preview"></div>
              </div>
            </div>
          </div>

          <!-- Brand -->
          <div id="panel-brand" class="tab-panel">
            <div class="brand-grid">
              <div class="brand-section">
                <h3>Colors</h3>
                <div id="brand-colors" class="color-palette"></div>
              </div>
              <div class="brand-section">
                <h3>Logo</h3>
                <div id="brand-logo" class="logo-preview"></div>
              </div>
              <div class="brand-section">
                <h3>Typography</h3>
                <div id="brand-fonts" class="font-list"></div>
              </div>
              <div class="brand-section wide">
                <h3>Hero Images</h3>
                <div id="brand-heroes" class="hero-gallery"></div>
              </div>
            </div>
          </div>

          <!-- Tech Stack -->
          <div id="panel-tech" class="tab-panel">
            <div id="tech-details" class="tech-grid"></div>
          </div>

          <!-- Scorecard / Audit -->
          <div id="panel-audit" class="tab-panel">
            <div class="audit-grid">
              <div class="gauge-row" id="audit-gauges"></div>
              <div class="audit-details" id="audit-details"></div>
            </div>
          </div>

          <!-- Competitive -->
          <div id="panel-competitive" class="tab-panel">
            <div id="competitive-details"></div>
          </div>

          <!-- Content Analysis -->
          <div id="panel-content" class="tab-panel">
            <div id="content-details"></div>
          </div>

          <!-- Drupal Demo -->
          <div id="panel-drupal" class="tab-panel">
            <div id="drupal-details"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script src="/js/app.js"></script>
</body>
</html>
